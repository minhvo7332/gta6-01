<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solara Bay — an original open-world crime game. Explore a sun-soaked coastal city on foot or by car, steal cars, outrun the police, run five story missions.">
<meta name="theme-color" content="#0e1a24">
<link rel="icon" href="data:,">
<title>Solara Bay — an open-world crime story</title>
<style>

  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  noscript p { color: #f5f1e6; font-family: system-ui, sans-serif; padding: 2rem; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solara Bay: an open-world crime game. Explore the city on foot or by car, steal cars, outrun the police, run story missions."></canvas>
<noscript><p>Solara Bay needs JavaScript to play — please enable it and reload.</p></noscript>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
